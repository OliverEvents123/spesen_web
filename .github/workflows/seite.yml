# Baut die Seite und stellt sie auf GitHub Pages — bei jeder Änderung auf main.
#
# Was wo landet:
#   spesen.tit-pit.ch/        echte App,    immer aus main,      web/.env.live (echte Datenbank)
#   spesen.tit-pit.ch/test/   Testfassung,  aus main — oder aus  web/.env.test (Testdatenbank)
#                             einem Arbeitsbranch, siehe unten
#
# Etwas zuerst nur in /test/ zeigen, ohne die echte App anzurühren:
#   Actions → "Seite bauen und veröffentlichen" → Run workflow (Branch main lassen)
#   → bei "Teststand" den Arbeitsbranch eintragen. Die echte App kommt dabei
#   weiterhin aus main. Der nächste Push auf main setzt /test/ wieder auf main.
#
# Voraussetzung (einmalig): Repo → Settings → Pages → Source: "GitHub Actions".

name: Seite bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      teststand:
        description: "Branch für /test/ (leer = main)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      # Die echte App kommt immer aus main — auch wenn jemand den Lauf
      # von einem anderen Branch aus startet.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: web
        run: npm ci

      - name: Echte App bauen
        working-directory: web
        run: |
          npm run bauen:live
          mv dist ../_site

      - name: Teststand holen
        if: inputs.teststand
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.teststand }}
          path: teststand

      - name: Testfassung bauen
        run: |
          if [ -d teststand ]; then
            cd teststand/web && npm ci
          else
            cd web
          fi
          npm run bauen:test
          mv dist "$GITHUB_WORKSPACE/_site/test"

      - name: Eigene Domain
        run: cp CNAME _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
