# Baut die Seite und stellt sie auf GitHub Pages — bei jeder Änderung auf main.
#
# Was wo landet — derselbe Code, zweimal gebaut:
#   spesen.tit-pit.ch/        echte App,    web/.env.live (echte Datenbank)
#   spesen.tit-pit.ch/test/   Testfassung,  web/.env.test (Testdatenbank)
#
# Voraussetzung (einmalig): Repo → Settings → Pages → Source: "GitHub Actions".

name: Seite bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: web
        run: npm ci

      - name: Echte App bauen
        working-directory: web
        run: |
          npm run bauen:live
          mv dist ../_site

      - name: Testfassung bauen
        working-directory: web
        run: |
          npm run bauen:test
          mv dist ../_site/test

      - name: Eigene Domain
        run: cp CNAME _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
