<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spesen</title>

<!-- Macht die Seite auf Android zu einer installierbaren App -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#215aa8">

<!-- iPhone kennt kein Manifest und braucht diese drei Angaben -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spesen">

<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet" href="stil.css">
</head>
<body>

<div id="app"></div>

<!-- unsichtbare Dateifelder: Kamera und Dateiauswahl -->
<input type="file" id="kamera" accept="image/*" capture="environment" hidden>
<input type="file" id="datei"  accept="image/*,application/pdf" hidden>

<!-- Reihenfolge ist wichtig: daten vor ansichten vor app -->
<!-- Feste Version: ein Update von Supabase soll die App nicht ungefragt ändern -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script src="konfig.js"></script>
<script src="daten.js"></script>
<script src="ansichten.js"></script>
<script src="export.js"></script>
<script src="app.js"></script>

<script>
// Meldet den Service Worker an. Ohne ihn bietet Android kein "App installieren".
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>

</body>
</html>
