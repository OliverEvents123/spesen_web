<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spesen</title>
<style>
  :root { --blau:#215aa8; --hell:#2f6cbd; --dunkel:#1b3d6b; --grau:#5A6478;
          --rand:#E1E4EC; --bg:#F4F5F8; --warn:#A08040; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--dunkel);
         font-family: Calibri, Carlito, "Segoe UI", system-ui, sans-serif; }
  .kopf { background:var(--blau); color:#fff; padding:calc(env(safe-area-inset-top) + 22px) 20px 16px;
          display:flex; align-items:center; gap:12px; }
  .kopf h1 { margin:0 0 2px; font-size:22px; }
  .kopf .sub { font-size:13px; color:#BDD1EA; }
  .kopf .wachs { flex-grow:1; }
  .reiter { background:var(--blau); padding:0 20px 12px; display:flex; gap:8px; }
  .reiter button { flex-grow:1; min-height:40px; border:0; border-radius:9px;
                   background:#2f6cbd; color:#BDD1EA; font-size:15px; }
  .reiter button.an { background:#fff; color:var(--blau); font-weight:700; }
  .inhalt { padding:14px 20px 40px; max-width:980px; margin:0 auto; }
  .karte { background:#fff; border:1px solid var(--rand); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  button { font-family:inherit; cursor:pointer; }
  .knopf { width:100%; min-height:54px; border:0; border-radius:12px; background:var(--blau);
           color:#fff; font-size:17px; font-weight:600; }
  .knopf[disabled] { background:#AEB6C6; font-size:15px; }
  .zweit { width:100%; min-height:48px; border:1px solid #C9D6E8; border-radius:11px;
           background:#fff; color:var(--blau); font-size:15px; font-weight:600; }
  .rund { width:40px; height:40px; border:0; border-radius:10px; background:var(--hell);
          color:#fff; font-size:19px; line-height:1; }
  .fehler { background:#FCEEED; border:1px solid #E9C3C0; color:#8E201B;
            border-radius:10px; padding:11px 14px; font-size:14px; margin-bottom:10px; }
  .ok { background:#E9F3ED; border:1px solid #BCDAC8; color:#124F32;
        border-radius:10px; padding:11px 14px; font-size:14px; margin-bottom:10px; }
  .mitte { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .mitte .karte { width:100%; max-width:380px; }
  .zeile { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .leer { text-align:center; color:var(--grau); font-size:15px; padding:26px 10px; }
  label { display:block; font-size:13px; color:var(--grau); margin-bottom:6px; }
  input, select { width:100%; min-height:48px; padding:0 14px; font-size:17px; font-family:inherit;
          border:1px solid #D5D9E3; border-radius:10px; background:#fff; color:var(--dunkel); }
  .paar { display:flex; gap:10px; flex-wrap:wrap; }
  .paar > div { flex:1 1 180px; min-width:0; }
  @media (max-width:520px) { .paar > div { flex:1 1 100%; } }
  .wahl { width:100%; text-align:left; background:#fff; border:1px solid var(--rand);
          border-radius:11px; min-height:58px; padding:8px 15px; display:flex;
          align-items:center; gap:12px; margin-bottom:10px; }
  .wahl.offen { border-color:#E8CFAE; }
  .wahl .titel { font-size:13px; color:var(--grau); width:60px; flex-shrink:0; }
  .wahl .wert { flex-grow:1; font-size:17px; font-weight:700; }
  .wahl .pfeil { color:#7D89A0; font-size:18px; }
  .block { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-bottom:10px; }
  .taste { min-height:52px; border:1px solid #D5D9E3; border-radius:10px; background:#fff;
           color:var(--dunkel); font-size:21px; font-weight:600; }
  .mwst { display:flex; gap:8px; margin-bottom:10px; }
  .mwst button { flex-grow:1; min-height:46px; border-radius:9px; border:1px solid #D5D9E3;
                 background:#fff; color:#3f5a80; font-size:15px; }
  .mwst button.an { background:var(--blau); border-color:var(--blau); color:#fff; font-weight:700; }
  .eintrag { width:100%; text-align:left; background:#fff; border:1px solid var(--rand);
             border-radius:11px; min-height:54px; padding:8px 15px; display:flex;
             align-items:center; gap:14px; margin-bottom:8px; }
  .eintrag.an { border:2px solid var(--blau); background:#EAF1FA; }
  .eintrag .nr { font-size:18px; font-weight:700; width:70px; flex-shrink:0; }
  .eintrag .nm { flex-grow:1; font-size:15px; color:#3f5a80; }
  .marke { font-size:11px; background:#EDEFF5; color:#3f5a80; border-radius:4px; padding:2px 6px; }
  .vorschau { width:100%; max-height:260px; object-fit:contain; border-radius:8px;
              background:#EDEFF5; display:block; }
  .pdfmarke { height:110px; border-radius:8px; background:#EDEFF5; display:flex;
              align-items:center; justify-content:center; font-size:15px; color:var(--grau); }
  .beleglink { border:1px solid #C9D6E8; background:#fff; color:var(--blau);
               border-radius:8px; min-height:36px; padding:0 12px; font-size:13px; }
  .ablage { transition:border-color .12s, background .12s; }
  body.ziehen .ablage { border:2px dashed var(--blau); background:#EAF1FA; }
  .ziehhinweis { display:none; font-size:13px; color:var(--blau); text-align:center; padding:6px 0 0; }
  body.ziehen .ziehhinweis { display:block; }
  .rollen { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table { border-collapse:collapse; width:100%; min-width:560px; }
  th, td { text-align:left; padding:10px 10px 10px 0; font-size:14px; white-space:nowrap; }
  th { font-size:12px; color:var(--grau); font-weight:600; border-bottom:2px solid #D5D9E3; }
  td { border-bottom:1px solid #EDEFF5; }
  .re { text-align:right; }
  .summe td { background:#EDEFF5; font-weight:700; border-bottom:0; }
  .gross { font-size:16px; font-weight:700; }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="kamera" accept="image/*" capture="environment" hidden>
<input type="file" id="datei"  accept="image/*,application/pdf" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="export.js"></script>
<script>
const SUPABASE_URL = "https://ieziwunnhyoiacleyspw.supabase.co";
const SUPABASE_KEY = "sb_publishable_vFDhfRba41suO17FZOHdAg_wa0jonFy";

const sb  = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById("app");

const ZAHLART = { karte:"Kreditkarte", bar:"Bar", vorkasse:"Vorauskasse" };
const zahlartName = (z) => ZAHLART[z || "karte"] || z;

const esc = (t) => String(t ?? "").replace(/[&<>"]/g,
  (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const heute = () => new Date().toLocaleDateString("sv-SE");
const monatName = (m) => {
  const n = ["Januar","Februar","März","April","Mai","Juni",
             "Juli","August","September","Oktober","November","Dezember"];
  const [j, mm] = m.split("-");
  return n[parseInt(mm,10)-1] + " " + j;
};
const chf = (z) => Number(z).toFixed(2);
const datumCH = (d) => new Date(d).toLocaleDateString("de-CH");

let S = {
  session:null, istAdmin:false, konten:[], auftraege:[], belege:[],
  monat: heute().slice(0,7), ansicht:"liste", neu:null, suche:"", meldung:null,
  uMonat: heute().slice(0,7), uGeraet:"", uZahlart:"", uBelege:[], uLaedt:false
};

const leererBeleg = () => ({ konto:null, auftrag:null, mwst:"8.1", roh:"",
                             datum: heute(), zahlart:"karte", datei:null, vorschau:null });
const betragVon = (roh) => parseInt(roh || "0", 10) / 100;
const ordnerName = (mail) => mail.replace(/@/g,"_").replace(/\./g,"_");
const kontoName = (nr) => {
  const k = S.konten.find(x => x.nummer === nr);
  return k ? k.bezeichnung : "";
};

// ---------- Start ----------
async function start() {
  const { data } = await sb.auth.getSession();
  if (!data.session) { zeigeLogin(); return; }
  S.session = data.session;
  await ladeAlles();
  render();
}

function zeigeLogin(meldung) {
  app.innerHTML = `
    <div class="mitte"><div class="karte">
      <h1 style="margin:0 0 4px; font-size:24px;">Spesen</h1>
      <p style="margin:0 0 18px; color:var(--grau); font-size:14px;">Bitte anmelden</p>
      ${meldung ? `<div class="fehler">${esc(meldung)}</div>` : ""}
      <form id="f">
        <label for="mail">E-Mail</label>
        <input id="mail" type="email" inputmode="email" autocomplete="username" required style="margin-bottom:12px">
        <label for="pw">Passwort</label>
        <input id="pw" type="password" autocomplete="current-password" required style="margin-bottom:18px">
        <button class="knopf" id="btn" type="submit">Anmelden</button>
      </form>
    </div></div>`;
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const b = document.getElementById("btn"); b.disabled = true; b.textContent = "Moment …";
    const { data, error } = await sb.auth.signInWithPassword({
      email: document.getElementById("mail").value.trim(),
      password: document.getElementById("pw").value });
    if (error) { zeigeLogin("Anmeldung fehlgeschlagen. E-Mail oder Passwort stimmt nicht."); return; }
    S.session = data.session; await ladeAlles(); render();
  });
}

// ---------- Daten ----------
async function ladeAlles() {
  const [k, b, adm] = await Promise.all([
    sb.from("spesen_konto").select("nummer,bezeichnung,mwst").eq("aktiv",true).order("sortierung"),
    sb.from("spesen_beleg").select("*").eq("monat", S.monat).eq("geraet", S.session.user.email)
      .order("beleg_datum",{ascending:false}).order("id",{ascending:false}),
    sb.rpc("ist_admin")
  ]);
  S.konten   = k.data || [];
  S.belege   = b.data || [];
  S.istAdmin = adm.data === true;
  if (!S.auftraege.length) {
    try {
      const r = await fetch(`${SUPABASE_URL}/functions/v1/auftragsnummern?jahr=${new Date().getFullYear()}`,
        { headers:{ Authorization:`Bearer ${S.session.access_token}`, apikey: SUPABASE_KEY } });
      const j = await r.json();
      if (j.ok) S.auftraege = j.auftragsnummern;
    } catch (e) { /* Hinweis erscheint bei der Auswahl */ }
  }
}

async function ladeUebersicht() {
  S.uLaedt = true; render();
  const { data } = await sb.from("spesen_beleg").select("*").eq("monat", S.uMonat)
    .order("beleg_datum",{ascending:true}).order("id",{ascending:true});
  S.uBelege = data || [];
  S.uLaedt  = false;
  render();
}

// ---------- Gruppierung ----------
// MwSt wird auf der Gruppensumme gerechnet, nicht je Beleg — sonst
// entstehen durch das Runden Rappendifferenzen.
function gruppiere(belege) {
  const m = new Map();
  for (const b of belege) {
    const s = `${b.konto_nummer}|${b.auftrag_nr}|${b.mwst}`;
    if (!m.has(s)) m.set(s, { konto:b.konto_nummer, bezeichnung:kontoName(b.konto_nummer),
                              auftrag:b.auftrag_nr, satz:Number(b.mwst), anzahl:0, brutto:0 });
    const g = m.get(s);
    g.anzahl += 1;
    g.brutto += parseFloat(b.betrag);
  }
  const liste = [...m.values()].map(g => {
    const netto = g.brutto / (1 + g.satz / 100);
    return { ...g, netto: Math.round(netto*100)/100,
             steuer: Math.round((g.brutto - netto)*100)/100 };
  });
  liste.sort((a,b) => a.konto.localeCompare(b.konto,"de",{numeric:true})
                   || a.auftrag.localeCompare(b.auftrag,"de",{numeric:true})
                   || b.satz - a.satz);
  return liste;
}

const uGefiltert = () => S.uBelege.filter(b =>
  (!S.uGeraet  || b.geraet === S.uGeraet) &&
  (!S.uZahlart || (b.zahlart || "karte") === S.uZahlart));

const uTitel = () => [
  monatName(S.uMonat),
  S.uGeraet || (S.istAdmin ? "Alle Geräte" : S.session.user.email),
  S.uZahlart ? zahlartName(S.uZahlart) : "Alle Zahlungsarten"
].join(" · ");

const uDateiname = () =>
  `Spesen_${S.uMonat}` +
  (S.uZahlart ? "_" + S.uZahlart : "") +
  (S.uGeraet ? "_" + S.uGeraet.split("@")[0] : (S.istAdmin ? "_alle" : "")) + ".pdf";

// ---------- Bild aufbereiten ----------
async function aufbereiten(file) {
  if (file.type === "application/pdf") return { blob:file, typ:"application/pdf", ext:"pdf" };
  try {
    const bm  = await createImageBitmap(file);
    const max = 2000;
    const f   = Math.min(1, max / Math.max(bm.width, bm.height));
    const c   = document.createElement("canvas");
    c.width   = Math.round(bm.width  * f);
    c.height  = Math.round(bm.height * f);
    c.getContext("2d").drawImage(bm, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.82));
    if (!blob) throw new Error("leer");
    return { blob, typ:"image/jpeg", ext:"jpg" };
  } catch {
    const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
    return { blob:file, typ:(file.type || "image/jpeg"), ext };
  }
}

function dateiGewaehlt(file) {
  if (!file || !S.neu) return;
  const erlaubt = file.type === "application/pdf" || file.type.startsWith("image/");
  if (!erlaubt) { alert("Bitte ein Bild oder ein PDF wählen."); return; }
  if (S.neu.vorschau) URL.revokeObjectURL(S.neu.vorschau);
  S.neu.datei    = file;
  S.neu.vorschau = file.type === "application/pdf" ? null : URL.createObjectURL(file);
  render();
}
document.getElementById("kamera").addEventListener("change", (e) => { dateiGewaehlt(e.target.files[0]); e.target.value = ""; });
document.getElementById("datei").addEventListener("change",  (e) => { dateiGewaehlt(e.target.files[0]); e.target.value = ""; });

// ---------- Ziehen und Ablegen ----------
let ziehZaehler = 0;
document.addEventListener("dragenter", (e) => {
  if (S.ansicht !== "erfassen") return;
  e.preventDefault(); ziehZaehler++; document.body.classList.add("ziehen");
});
document.addEventListener("dragover", (e) => {
  if (S.ansicht !== "erfassen") return;
  e.preventDefault(); e.dataTransfer.dropEffect = "copy";
});
document.addEventListener("dragleave", () => {
  if (S.ansicht !== "erfassen") return;
  if (--ziehZaehler <= 0) { ziehZaehler = 0; document.body.classList.remove("ziehen"); }
});
document.addEventListener("drop", (e) => {
  if (S.ansicht !== "erfassen") return;
  e.preventDefault(); ziehZaehler = 0; document.body.classList.remove("ziehen");
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) dateiGewaehlt(f);
});

async function belegOeffnen(pfad) {
  const { data, error } = await sb.storage.from("belege").createSignedUrl(pfad, 60);
  if (error) { alert("Beleg konnte nicht geöffnet werden:\n" + error.message); return; }
  window.open(data.signedUrl, "_blank");
}

// ---------- Ansichten ----------
function render() {
  if (S.ansicht === "liste")       return renderListe();
  if (S.ansicht === "uebersicht")  return renderUebersicht();
  if (S.ansicht === "erfassen")    return renderErfassen();
  if (S.ansicht === "kontoWahl")   return renderKontoWahl();
  if (S.ansicht === "auftragWahl") return renderAuftragWahl();
}

function kopf(titel, sub, zurueck) {
  return `<div class="kopf">
    ${zurueck ? `<button class="rund" data-akt="zurueck" aria-label="Zurück">‹</button>` : ""}
    <div class="wachs"><h1>${esc(titel)}</h1><div class="sub">${esc(sub)}</div></div>
    ${zurueck ? "" : `<button class="rund" data-akt="abmelden" style="width:auto;padding:0 12px;font-size:14px;">Abmelden</button>`}
  </div>`;
}

function reiter() {
  return `<div class="reiter">
    <button class="${S.ansicht==="liste"?"an":""}" data-akt="tabListe">Meine Belege</button>
    <button class="${S.ansicht==="uebersicht"?"an":""}" data-akt="tabUebersicht">Übersicht</button>
  </div>`;
}

function renderListe() {
  const summe = S.belege.reduce((t,b) => t + parseFloat(b.betrag), 0);
  app.innerHTML = kopf("Meine Spesen", `${S.session.user.email} · ${monatName(S.monat)}`) + reiter() + `
    <div class="inhalt">
      ${S.meldung ? `<div class="ok">${esc(S.meldung)}</div>` : ""}
      <div class="karte zeile">
        <div><div style="font-size:13px;color:var(--grau);">Erfasst diesen Monat</div>
             <div style="font-size:22px;font-weight:700;">${S.belege.length} ${S.belege.length===1?"Beleg":"Belege"}</div></div>
        <div style="text-align:right;"><div style="font-size:13px;color:var(--grau);">Total</div>
             <div style="font-size:22px;font-weight:700;">CHF ${chf(summe)}</div></div>
      </div>
      <button class="knopf" data-akt="neu" style="margin-bottom:14px;">Spesen erfassen</button>
      ${S.belege.length === 0
        ? `<div class="karte leer">Noch keine Belege in diesem Monat.</div>`
        : S.belege.map(b => `
          <div class="karte zeile">
            <div>
              <div style="font-weight:600;">${esc(b.konto_nummer)} ${esc(kontoName(b.konto_nummer))} · ${esc(b.auftrag_nr)}</div>
              <div style="font-size:13px;color:var(--grau);">
                ${datumCH(b.beleg_datum)} · MwSt ${b.mwst} % · ${esc(zahlartName(b.zahlart))}</div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              ${b.datei_pfad ? `<button class="beleglink" data-akt="belegAuf" data-p="${esc(b.datei_pfad)}">Beleg</button>` : ""}
              <div style="font-size:17px;font-weight:700;">${chf(b.betrag)}</div>
            </div>
          </div>`).join("")}
    </div>`;
  S.meldung = null;
}

function renderUebersicht() {
  const geraete = [...new Set(S.uBelege.map(b => b.geraet))].sort();
  const gefiltert = uGefiltert();
  const gruppen = gruppiere(gefiltert);
  const tBrutto = gruppen.reduce((t,g) => t + g.brutto, 0);
  const tSteuer = gruppen.reduce((t,g) => t + g.steuer, 0);
  const tNetto  = gruppen.reduce((t,g) => t + g.netto,  0);
  const tAnzahl = gruppen.reduce((t,g) => t + g.anzahl, 0);

  app.innerHTML = kopf("Übersicht", S.istAdmin ? "Alle Geräte" : S.session.user.email) + reiter() + `
    <div class="inhalt">

      <div class="karte">
        <div class="paar">
          <div>
            <label for="umonat">Monat</label>
            <input id="umonat" type="month" value="${S.uMonat}" data-feld="umonat">
          </div>
          <div>
            <label for="uzahlart">Zahlungsart</label>
            <select id="uzahlart" data-feld="uzahlart">
              <option value="" ${S.uZahlart===""?"selected":""}>Alle</option>
              ${Object.entries(ZAHLART).map(([w,n]) =>
                `<option value="${w}" ${S.uZahlart===w?"selected":""}>${n}</option>`).join("")}
            </select>
          </div>
          ${S.istAdmin ? `
          <div>
            <label for="ugeraet">Gerät / Karte</label>
            <select id="ugeraet" data-feld="ugeraet">
              <option value="">Alle Geräte</option>
              ${geraete.map(g => `<option value="${esc(g)}" ${S.uGeraet===g?"selected":""}>${esc(g)}</option>`).join("")}
            </select>
          </div>` : ""}
        </div>
      </div>

      ${S.uLaedt ? `<div class="karte leer">Lade …</div>` : gefiltert.length === 0
        ? `<div class="karte leer">Keine Belege für diese Auswahl.</div>`
        : `
        <div class="karte">
          <div style="font-size:17px;font-weight:700;margin-bottom:3px;">Kontierung</div>
          <div style="font-size:13px;color:var(--grau);margin-bottom:12px;">${esc(uTitel())}</div>
          <div class="rollen"><table>
            <thead><tr>
              <th>Konto</th><th>Bezeichnung</th><th>Auftrag</th><th>MwSt</th>
              <th class="re">Belege</th><th class="re">Brutto</th>
              <th class="re">MwSt-Betrag</th><th class="re">Netto</th>
            </tr></thead>
            <tbody>
              ${gruppen.map(g => `<tr>
                <td class="gross">${esc(g.konto)}</td>
                <td>${esc(g.bezeichnung)}</td>
                <td>${esc(g.auftrag)}</td>
                <td>${g.satz} %</td>
                <td class="re">${g.anzahl}</td>
                <td class="re gross">${chf(g.brutto)}</td>
                <td class="re">${chf(g.steuer)}</td>
                <td class="re">${chf(g.netto)}</td>
              </tr>`).join("")}
              <tr class="summe">
                <td colspan="4">Total</td>
                <td class="re">${tAnzahl}</td>
                <td class="re">${chf(tBrutto)}</td>
                <td class="re">${chf(tSteuer)}</td>
                <td class="re">${chf(tNetto)}</td>
              </tr>
            </tbody>
          </table></div>
        </div>

        <div class="karte">
          <div style="font-size:17px;font-weight:700;margin-bottom:3px;">Export für DocuWare</div>
          <div style="font-size:13px;color:var(--grau);margin-bottom:12px;">
            Im PDF steht diese Übersicht vorn, danach folgen alle ${tAnzahl} Belege.</div>
          <button class="knopf" data-akt="expPdf" style="margin-bottom:8px;">PDF erzeugen</button>
          <button class="zweit" data-akt="expCsv">Buchungsliste als CSV</button>
        </div>

        <div class="karte">
          <div style="font-size:17px;font-weight:700;margin-bottom:12px;">Einzelne Belege</div>
          ${gefiltert.map((b,i) => `
            <div class="zeile" style="padding:9px 0;border-bottom:1px solid #EDEFF5;">
              <div>
                <div style="font-weight:600;">${i+1} · ${esc(b.konto_nummer)} · ${esc(b.auftrag_nr)} · ${b.mwst} %</div>
                <div style="font-size:13px;color:var(--grau);">
                  ${datumCH(b.beleg_datum)} · ${esc(zahlartName(b.zahlart))}${S.istAdmin && !S.uGeraet ? " · " + esc(b.geraet) : ""}</div>
              </div>
              <div style="display:flex;align-items:center;gap:10px;">
                ${b.datei_pfad ? `<button class="beleglink" data-akt="belegAuf" data-p="${esc(b.datei_pfad)}">Beleg</button>` : ""}
                <div style="font-weight:700;">${chf(b.betrag)}</div>
              </div>
            </div>`).join("")}
        </div>`}
    </div>`;
}

function renderErfassen() {
  const n = S.neu;
  const betrag = betragVon(n.roh);
  const fertig = betrag > 0 && n.konto && n.auftrag && n.datei;
  const tasten = ["1","2","3","4","5","6","7","8","9","00","0","⌫"];

  const belegKarte = n.datei
    ? `<div class="karte ablage">
         ${n.vorschau
           ? `<img class="vorschau" src="${n.vorschau}" alt="Belegvorschau">`
           : `<div class="pdfmarke">PDF: ${esc(n.datei.name)}</div>`}
         <button class="zweit" data-akt="belegNeu" style="margin-top:10px;">Anderen Beleg wählen</button>
         <div class="ziehhinweis">Datei hier ablegen, um sie zu ersetzen</div>
       </div>`
    : `<div class="karte ablage">
         <div style="font-size:13px;color:var(--grau);margin-bottom:10px;">Beleg</div>
         <button class="knopf" data-akt="foto" style="margin-bottom:8px;">Beleg fotografieren</button>
         <button class="zweit" data-akt="waehlen">PDF oder Bild wählen</button>
         <div style="font-size:12px;color:var(--grau);text-align:center;padding-top:8px;">
           am Rechner auch per Ziehen und Ablegen</div>
         <div class="ziehhinweis">Datei hier ablegen</div>
       </div>`;

  app.innerHTML = kopf("Beleg erfassen", "Angaben prüfen und speichern", true) + `
    <div class="inhalt">
      ${belegKarte}

      <button class="wahl ${n.konto ? "" : "offen"}" data-akt="kontoWahl">
        <span class="titel">Konto</span>
        <span class="wert" style="color:${n.konto ? "var(--dunkel)" : "var(--warn)"}">
          ${n.konto ? esc(n.konto.nummer + "  " + n.konto.bezeichnung) : "wählen"}</span>
        <span class="pfeil">›</span>
      </button>

      <button class="wahl ${n.auftrag ? "" : "offen"}" data-akt="auftragWahl">
        <span class="titel">Auftrag</span>
        <span class="wert" style="color:${n.auftrag ? "var(--dunkel)" : "var(--warn)"}">
          ${n.auftrag ? esc(n.auftrag.id + (n.auftrag.name ? "  " + n.auftrag.name : "")) : "wählen"}</span>
        <span class="pfeil">›</span>
      </button>

      <div class="karte">
        <div class="paar">
          <div>
            <label for="datum">Belegdatum</label>
            <input id="datum" type="date" value="${n.datum}" data-feld="datum">
          </div>
          <div>
            <label for="zahlart">Bezahlt mit</label>
            <select id="zahlart" data-feld="zahlart">
              ${Object.entries(ZAHLART).map(([w,t]) =>
                `<option value="${w}" ${n.zahlart===w?"selected":""}>${t}</option>`).join("")}
            </select>
          </div>
        </div>
      </div>

      <div class="karte zeile">
        <span style="font-size:14px;color:var(--grau);">Betrag CHF</span>
        <span style="font-size:34px;font-weight:700;line-height:1.1;
                     color:${betrag>0 ? "var(--dunkel)" : "#AEB6C6"};">${chf(betrag)}</span>
      </div>

      <div class="block">
        ${tasten.map(t => `<button class="taste" data-akt="ziffer" data-z="${t}">${t}</button>`).join("")}
      </div>

      <div class="mwst">
        ${["8.1","2.6","3.8","0"].map(m =>
          `<button class="${n.mwst===m?"an":""}" data-akt="mwst" data-v="${m}">${m}&nbsp;%</button>`).join("")}
      </div>

      <button class="knopf" data-akt="speichern" ${fertig ? "" : "disabled"}>
        ${fertig ? "Speichern" : "Beleg, Konto, Auftrag und Betrag nötig"}</button>
    </div>`;
}

function renderKontoWahl() {
  app.innerHTML = kopf("Konto wählen", `${S.konten.length} Konten`, true) + `
    <div class="inhalt">
      ${S.konten.map(k => `
        <button class="eintrag ${S.neu.konto && S.neu.konto.nummer===k.nummer ? "an":""}"
                data-akt="kontoSet" data-nr="${esc(k.nummer)}">
          <span class="nr">${esc(k.nummer)}</span>
          <span class="nm">${esc(k.bezeichnung)}</span>
          <span class="marke">${k.mwst} %</span>
        </button>`).join("")}
    </div>`;
}

function renderAuftragWahl() {
  app.innerHTML = kopf("Auftrag wählen", `${S.auftraege.length} Nummern`, true) + `
    <div class="inhalt">
      <input id="suche" type="search" placeholder="Nummer oder Name suchen"
             value="${esc(S.suche)}" style="margin-bottom:12px;">
      <div id="treffer"></div>
    </div>`;
  const feld = document.getElementById("suche");
  feld.addEventListener("input", () => { S.suche = feld.value; zeichneTreffer(); });
  zeichneTreffer();
}

function zeichneTreffer() {
  const q = S.suche.trim().toLowerCase();
  const liste = (q
    ? S.auftraege.filter(a => a.id.toLowerCase().includes(q) || a.name.toLowerCase().includes(q))
    : S.auftraege).slice(0, 60);
  const ziel = document.getElementById("treffer");
  if (!ziel) return;
  if (!S.auftraege.length) {
    ziel.innerHTML = `<div class="fehler">Die Auftragsnummern konnten nicht aus FileMaker
      geladen werden. Seite neu laden oder später nochmal versuchen.</div>`;
    return;
  }
  ziel.innerHTML = liste.length === 0
    ? `<div class="karte leer">Nichts gefunden.</div>`
    : liste.map(a => `
      <button class="eintrag ${S.neu.auftrag && S.neu.auftrag.id===a.id ? "an":""}"
              data-akt="auftragSet" data-id="${esc(a.id)}">
        <span class="nr">${esc(a.id)}</span>
        <span class="nm">${esc(a.name)}</span>
        ${a.immer ? `<span class="marke">fix</span>` : ""}
      </button>`).join("");
}

// ---------- Klicks ----------
app.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-akt]");
  if (!el) return;
  const a = el.dataset.akt;

  if (a === "abmelden")   { await sb.auth.signOut(); S.session=null; S.auftraege=[]; zeigeLogin(); return; }
  if (a === "tabListe")   { S.ansicht = "liste"; return render(); }
  if (a === "tabUebersicht") { S.ansicht = "uebersicht"; return ladeUebersicht(); }
  if (a === "neu")        { S.neu = leererBeleg(); S.ansicht = "erfassen"; return render(); }
  if (a === "zurueck")    { S.ansicht = (S.ansicht === "erfassen") ? "liste" : "erfassen"; return render(); }
  if (a === "kontoWahl")  { S.ansicht = "kontoWahl"; return render(); }
  if (a === "auftragWahl"){ S.suche = ""; S.ansicht = "auftragWahl"; return render(); }
  if (a === "foto")       { document.getElementById("kamera").click(); return; }
  if (a === "waehlen")    { document.getElementById("datei").click(); return; }
  if (a === "belegNeu")   { S.neu.datei = null; S.neu.vorschau = null; return render(); }
  if (a === "belegAuf")   { return belegOeffnen(el.dataset.p); }

  if (a === "expCsv") {
    const belege = uGefiltert().map(b => ({ ...b, bezeichnung: kontoName(b.konto_nummer) }));
    SpesenExport.csv({ belege, gruppen: gruppiere(belege), monat: S.uMonat,
                       titel: uTitel(), dateiname: uDateiname().replace(".pdf",".csv") });
    return;
  }

  if (a === "expPdf") {
    const belege = uGefiltert().map(b => ({ ...b, bezeichnung: kontoName(b.konto_nummer) }));
    el.disabled = true;
    try {
      await SpesenExport.pdf({
        sb, belege, gruppen: gruppiere(belege), monat: S.uMonat, titel: uTitel(),
        dateiname: uDateiname(),
        fortschritt: (i, n) => { el.textContent = `Beleg ${i} von ${n} …`; }
      });
    } catch (err) {
      alert("Das PDF konnte nicht erstellt werden:\n" + (err.message || err));
    }
    el.textContent = "PDF erzeugen"; el.disabled = false;
    return;
  }

  if (a === "kontoSet") {
    const k = S.konten.find(x => x.nummer === el.dataset.nr);
    S.neu.konto = k; S.neu.mwst = String(k.mwst);
    S.ansicht = "erfassen"; return render();
  }
  if (a === "auftragSet") {
    S.neu.auftrag = S.auftraege.find(x => x.id === el.dataset.id);
    S.ansicht = "erfassen"; return render();
  }
  if (a === "mwst") { S.neu.mwst = el.dataset.v; return render(); }
  if (a === "ziffer") {
    const z = el.dataset.z;
    if (z === "⌫") S.neu.roh = S.neu.roh.slice(0, -1);
    else if (S.neu.roh.length + z.length <= 7) S.neu.roh = (S.neu.roh + z).replace(/^0+(?=\d)/, "");
    return render();
  }

  if (a === "speichern") {
    const n = S.neu, betrag = betragVon(n.roh);
    el.disabled = true; el.textContent = "Bereite Beleg auf …";

    let pfad = null;
    try {
      const { blob, typ, ext } = await aufbereiten(n.datei);
      el.textContent = "Lade Beleg hoch …";
      pfad = `${ordnerName(S.session.user.email)}/${n.datum.slice(0,7)}/${Date.now()}.${ext}`;
      const { error: upFehler } = await sb.storage.from("belege")
        .upload(pfad, blob, { contentType: typ, upsert:false });
      if (upFehler) throw upFehler;
    } catch (err) {
      el.disabled = false; el.textContent = "Speichern";
      alert("Der Beleg konnte nicht hochgeladen werden:\n" + (err.message || err));
      return;
    }

    el.textContent = "Speichere …";
    const { error } = await sb.from("spesen_beleg").insert({
      geraet:       S.session.user.email,
      beleg_datum:  n.datum,
      betrag:       betrag,
      mwst:         parseFloat(n.mwst),
      konto_nummer: n.konto.nummer,
      auftrag_nr:   n.auftrag.id,
      zahlart:      n.zahlart,
      datei_pfad:   pfad,
      monat:        n.datum.slice(0, 7)
    });
    if (error) {
      el.disabled = false; el.textContent = "Speichern";
      alert("Konnte nicht gespeichert werden:\n" + error.message);
      return;
    }

    if (n.vorschau) URL.revokeObjectURL(n.vorschau);
    S.meldung = `Beleg über CHF ${chf(betrag)} gespeichert.`;
    S.neu = null; S.ansicht = "liste";
    await ladeAlles(); render();
  }
});

app.addEventListener("change", (e) => {
  const f = e.target.dataset && e.target.dataset.feld;
  if (f === "datum")    { S.neu.datum = e.target.value; }
  if (f === "zahlart")  { S.neu.zahlart = e.target.value; }
  if (f === "umonat")   { S.uMonat = e.target.value; S.uGeraet = ""; ladeUebersicht(); }
  if (f === "ugeraet")  { S.uGeraet = e.target.value; render(); }
  if (f === "uzahlart") { S.uZahlart = e.target.value; render(); }
});

start();
</script>
</body>
</html>
