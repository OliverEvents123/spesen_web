<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Spesen TEST</title>

<!-- Bewusst KEIN Manifest und KEIN Service Worker.
     Die Testfassung soll sich nicht installieren lassen und nichts
     zwischenspeichern, sonst mischt sie sich mit der echten App. -->

<link rel="stylesheet" href="stil.css">
</head>
<body>

<div style="background:#A3241F;color:#fff;text-align:center;letter-spacing:.05em;
            font-family:Calibri,Carlito,'Segoe UI',system-ui,sans-serif;
            font-size:13px;font-weight:700;padding:7px 12px;">
  TESTUMGEBUNG · eigene Testdatenbank, nicht die echten Belege
</div>

<div id="app"></div>

<!-- unsichtbare Dateifelder: Kamera und Dateiauswahl -->
<input type="file" id="kamera" accept="image/*" capture="environment" hidden>
<input type="file" id="datei"  accept="image/*,application/pdf" hidden>

<!-- Reihenfolge ist wichtig: daten vor ansichten vor app -->
<!-- Feste Version: ein Update von Supabase soll die App nicht ungefragt ändern -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script src="konfig.js"></script>
<script src="daten.js"></script>
<script src="ansichten.js"></script>
<script src="export.js"></script>
<script src="app.js"></script>

</body>
</html>
